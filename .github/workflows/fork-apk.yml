name: Build fork APK

on:
  workflow_dispatch:
  push:
    branches: [build/fork-apk]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve required Flutter version
        id: flutter
        shell: bash
        run: |
          version=$(sed -n 's/^  flutter: \^*//p' pubspec.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run utility tests
        run: flutter test --no-pub test/map_utils_test.dart test/sort_utils_test.dart test/media_duration_test.dart test/regional_discovery_test.dart test/music_taste_test.dart test/music_taste_page_test.dart test/music_taste_storage_test.dart
      - name: Build installable APK
        run: flutter build apk --debug --flavor github --no-pub
      - uses: actions/upload-artifact@v5
        with:
          name: Musify-fork-debug-APK
          path: build/app/outputs/flutter-apk/app-github-debug.apk
          if-no-files-found: error
          retention-days: 30
